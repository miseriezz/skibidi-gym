<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#27272a" stroke-width="8"/>
  <!-- Dumbbell icon -->
  <g transform="translate(256, 220) rotate(-18)">
    <!-- Bar -->
    <rect x="-110" y="-14" width="220" height="28" rx="8" fill="#a1a1aa"/>
    <!-- Left inner plate -->
    <rect x="-145" y="-75" width="38" height="150" rx="12" fill="url(#accent)"/>
    <!-- Left outer plate -->
    <rect x="-190" y="-52" width="34" height="104" rx="10" fill="#34d399"/>
    <!-- Right inner plate -->
    <rect x="107" y="-75" width="38" height="150" rx="12" fill="url(#accent)"/>
    <!-- Right outer plate -->
    <rect x="156" y="-52" width="34" height="104" rx="10" fill="#34d399"/>
  </g>
  <!-- SKIBIDI Label -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="60" fill="#fafafa" text-anchor="middle" letter-spacing="4">SKIBIDI</text>
</svg>
